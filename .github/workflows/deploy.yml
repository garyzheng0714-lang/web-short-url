name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端在 CI 构建（服务器只有 2 核且跑着别的服务），产物复制过去
      - name: Build web
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web

      - name: Pull backend on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/web-short-url' }}
            # 2026-09-19 迁到 121.40.214.5：目录属主是迁移带来的未知 uid，服务器也没有 GitHub SSH 凭证。公开仓库直接走 HTTPS 拉取，只允许快进。
            git -c safe.directory="$PWD" pull --ff-only https://github.com/garyzheng0714-lang/web-short-url.git main
            mkdir -p web/dist

      - name: Copy web/dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: web/dist
          target: ${{ secrets.DEPLOY_PATH || '/opt/web-short-url' }}
          rm: true
          overwrite: true

      - name: Install, restart, health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/web-short-url' }}
            test -f web/dist/index.html
            npm ci --omit=dev --no-audit --no-fund
            pm2 restart web-short-url --update-env
            sleep 3
            # 端口以 .env 为准（新服务器 3000 被别的服务占用，当前 3010）
            PORT=$(grep -E '^PORT=' .env | tail -1 | cut -d= -f2)
            curl -sf "http://127.0.0.1:${PORT:-3000}/api/health" || (echo "Health check failed!" && pm2 logs web-short-url --nostream --lines 40 && exit 1)
