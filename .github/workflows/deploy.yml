name: Deploy to Production

on:
  push:
    branches: [codex/short-url-ui]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/web-short-url' }}
            git pull origin codex/short-url-ui

            # ---- one-shot, idempotent .env migration: v2 → v3 (dual-tenant) ----
            if [ -f .env ] && ! grep -q '^FEISHU_FBIF_APP_ID=' .env; then
              echo "[deploy] migrating .env from v2 to v3 dual-tenant schema"
              cp .env ".env.bak.$(date +%s)"
              sed -i 's/^FEISHU_APP_ID=/FEISHU_FBIF_APP_ID=/' .env
              sed -i 's/^FEISHU_APP_SECRET=/FEISHU_FBIF_APP_SECRET=/' .env
              sed -i '/^FEISHU_OAUTH_REDIRECT_URI=/d' .env
              {
                echo ''
                echo '# === appended by deploy.yml on v2→v3 migration ==='
                echo 'FEISHU_FUDE_APP_ID='
                echo 'FEISHU_FUDE_APP_SECRET='
                echo 'FEISHU_REDIRECT_BASE=https://shorturl.garyzheng.com'
              } >> .env
              echo "[deploy] .env migrated. Backup: .env.bak.*"
            else
              echo "[deploy] .env already on v3 schema, skipping migration"
            fi

            npm ci --production
            pm2 restart web-short-url
            sleep 2
            curl -sf http://127.0.0.1:3000/api/health || (echo "Health check failed!" && exit 1)
