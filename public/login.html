<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · FBIF 短链工具</title>
    <meta name="description" content="使用飞书账号登录 FBIF 短链工具" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-blue: #255f89;
        --brand-blue-hover: #1f5278;
        --brand-blue-active: #194562;
        --focus-ring: rgba(37, 95, 137, 0.28);
        --surface: #ffffff;
        --page-start: #f4f7fa;
        --page-end: #fafbfc;
        --border: #e5e9f0;
        --border-soft: #eef1f6;
        --text-primary: #12243a;
        --text-muted: #728196;
        --text-muted-hover: #4f6074;
        --tab-inactive-bg: #f4f7fa;
        --tab-inactive-text: #4f6074;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: linear-gradient(180deg, var(--page-start) 0%, var(--page-end) 100%);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .card {
        position: relative;
        width: min(100%, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 32px 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 1px 3px rgba(15, 31, 51, 0.04), 0 8px 24px rgba(15, 31, 51, 0.04);
        overflow: hidden;
      }

      /* ===== Corner Badge ===== */
      .corner-badge {
        position: absolute;
        top: 0;
        right: 0;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 0;
        background: var(--brand-blue);
        cursor: pointer;
        clip-path: polygon(100% 0, 0 0, 100% 100%);
        border-top-right-radius: 16px;
        transition: background-color 140ms ease;
      }
      .corner-badge:hover {
        background: var(--brand-blue-hover);
      }
      .corner-badge .icon {
        position: absolute;
        top: 8px;
        right: 8px;
        display: block;
        line-height: 0;
        color: #fff;
      }

      /* ===== OAuth View ===== */
      .fbif-logo {
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
        margin: 0 0 20px;
      }
      .fbif-logo img {
        width: 120px;
        height: 120px;
        display: block;
        object-fit: contain;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      /* ===== Feishu Button (shared) ===== */
      .feishu-btn {
        width: 100%;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 18px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
        transition: transform 140ms ease, background-color 140ms ease, color 140ms ease,
          border-color 140ms ease, box-shadow 140ms ease;
      }
      .feishu-btn:disabled {
        cursor: progress;
        opacity: 0.85;
      }
      .feishu-btn:focus-visible {
        outline: 4px solid var(--focus-ring);
        outline-offset: 3px;
      }

      /* Fill 主按钮（FBIF） */
      .feishu-btn.fill {
        background: var(--brand-blue);
        color: #fff;
        border: 0;
        box-shadow: 0 1px 2px rgba(37, 95, 137, 0.18);
      }
      .feishu-btn.fill:hover {
        background: var(--brand-blue-hover);
        box-shadow: 0 2px 5px rgba(37, 95, 137, 0.18);
      }
      .feishu-btn.fill:active {
        background: var(--brand-blue-active);
      }

      /* Outline 次按钮（富的） */
      .feishu-btn.outline {
        background: #fff;
        color: var(--brand-blue);
        border: 1.5px solid var(--brand-blue);
        box-shadow: none;
      }
      .feishu-btn.outline:hover {
        background: #f4f8fb;
        color: var(--brand-blue-hover);
        border-color: var(--brand-blue-hover);
        box-shadow: 0 1px 3px rgba(37, 95, 137, 0.1);
      }

      /* 按钮内飞书 logo 的 pill shell */
      .pill {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 999px;
      }
      .pill.on-fill {
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 31, 51, 0.1), inset 0 0 0 1px rgba(15, 31, 51, 0.04);
      }
      .pill.on-outline {
        background: #eaf1f7;
        box-shadow: inset 0 0 0 1px rgba(37, 95, 137, 0.1);
      }

      /* ===== QR View ===== */
      .qr-title {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 8px 0 4px;
        text-align: center;
      }
      .qr-tabs {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--tab-inactive-bg);
        border: 1px solid var(--border-soft);
        margin: 4px 0 18px;
      }
      .qr-tab {
        min-width: 64px;
        height: 30px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--tab-inactive-text);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 140ms ease, color 140ms ease;
        font-family: inherit;
      }
      .qr-tab.active {
        background: var(--brand-blue);
        color: #fff;
        font-weight: 600;
        cursor: default;
      }
      .qr-hint {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 16px;
        text-align: center;
      }
      .qr-frame {
        position: relative;
        width: 260px;
        height: 260px;
        padding: 10px;
        background: #f7f9fb;
        border-radius: 12px;
        display: grid;
        place-items: center;
      }
      .qr-mount {
        width: 240px;
        height: 240px;
        display: grid;
        place-items: center;
      }
      .qr-overlay {
        position: absolute;
        inset: 10px;
        border-radius: 8px;
        background: rgba(247, 249, 251, 0.85);
        display: grid;
        place-items: center;
        font-size: 13px;
        color: var(--text-muted);
        padding: 16px;
        text-align: center;
      }
      .qr-overlay.error {
        color: #c53030;
      }
      .qr-overlay button {
        margin-top: 12px;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text-primary);
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .qr-expired {
        position: absolute;
        inset: 10px;
        border-radius: 8px;
        background: rgba(18, 36, 58, 0.55);
        display: grid;
        place-items: center;
        border: 0;
        cursor: pointer;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
      }
      .qr-expired-inner {
        display: grid;
        place-items: center;
        gap: 6px;
      }
      .switch-link {
        margin-top: 24px;
        background: transparent;
        border: 0;
        padding: 0;
        color: var(--brand-blue);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }

      /* ===== Error banner ===== */
      .error-banner {
        width: 100%;
        margin: 0 0 16px;
        padding: 10px 12px;
        background: #fff5f5;
        border: 1px solid #fed7d7;
        border-radius: 8px;
        color: #c53030;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }
      .error-banner[hidden] {
        display: none;
      }

      /* ===== Responsive ===== */
      @media (max-width: 480px) {
        .card {
          padding: 32px 24px 28px;
        }
        .fbif-logo,
        .fbif-logo img {
          width: 108px;
          height: 108px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <button
        type="button"
        class="corner-badge"
        id="cornerBadge"
        aria-label="切换到扫码登录"
        title="扫码登录"
      >
        <span class="icon" id="cornerIcon"></span>
      </button>

      <!-- 错误提示（被服务端 redirect 时带 query 显示） -->
      <div class="error-banner" id="errorBanner" hidden></div>

      <!-- OAuth 视图（默认） -->
      <section id="viewOauth">
        <div class="fbif-logo">
          <img src="/fbif-logo.webp" alt="FBIF" width="120" height="120" />
        </div>
        <div class="buttons">
          <button type="button" class="feishu-btn fill" data-login-tenant="fbif">
            <span class="pill on-fill" data-feishu-logo></span>
            <span class="btn-text">使用 FBIF 飞书登录</span>
          </button>
          <button type="button" class="feishu-btn outline" data-login-tenant="fude">
            <span class="pill on-outline" data-feishu-logo></span>
            <span class="btn-text">使用 富的 飞书登录</span>
          </button>
        </div>
      </section>

      <!-- 扫码视图 -->
      <section id="viewQr" hidden>
        <div class="qr-title">扫码登录</div>
        <div class="qr-tabs" role="tablist" aria-label="选择登录企业">
          <button type="button" class="qr-tab active" role="tab" data-qr-tenant="fbif">FBIF</button>
          <button type="button" class="qr-tab" role="tab" data-qr-tenant="fude">富的</button>
        </div>
        <div class="qr-hint" id="qrHint">请使用 FBIF 飞书移动端扫描</div>
        <div class="qr-frame">
          <div class="qr-mount" id="qrMount"></div>
          <div class="qr-overlay" id="qrLoading">加载二维码中…</div>
          <div class="qr-overlay error" id="qrError" hidden>
            <div>
              <div id="qrErrorMsg">加载失败</div>
              <button type="button" id="qrRetry">重试</button>
            </div>
          </div>
          <button type="button" class="qr-expired" id="qrExpired" hidden aria-label="刷新二维码">
            <span class="qr-expired-inner">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M12 4V1L7 6l5 5V7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5H5a7 7 0 0 0 7 7 7 7 0 0 0 7-7 7 7 0 0 0-7-7z"
                  fill="#fff"
                />
              </svg>
              <span>刷新二维码</span>
            </span>
          </button>
        </div>
        <div style="display: flex; justify-content: center; width: 100%">
          <button type="button" class="switch-link" id="switchToOauth">使用账号登录</button>
        </div>
      </section>
    </main>

    <script>
      // ===== 0. 已登录直接跳走（避免登录后重复看到登录页） =====
      (async function checkAlreadyLoggedIn() {
        try {
          const headers = {};
          // 兼容 hash session_token 回流场景
          const hash = window.location.hash || "";
          const m = hash.match(/(?:^|[&#])session_token=([^&]+)/);
          if (m) {
            try {
              sessionStorage.setItem("shorturl_session_token", decodeURIComponent(m[1]));
              window.history.replaceState({}, "", window.location.pathname + window.location.search);
            } catch {}
          }
          const stored = sessionStorage.getItem("shorturl_session_token");
          if (stored) headers["X-Session-Token"] = stored;
          const res = await fetch("/api/me", { credentials: "include", headers });
          if (res.ok) {
            const next = new URLSearchParams(window.location.search).get("next") || "/";
            window.location.replace(next);
          }
        } catch {
          // 网络错误就让用户手动点登录
        }
      })();

      // ===== 1. 视图切换（角标 + 切回链接） =====
      const card = document.getElementById("card");
      const viewOauth = document.getElementById("viewOauth");
      const viewQr = document.getElementById("viewQr");
      const cornerBadge = document.getElementById("cornerBadge");
      const cornerIcon = document.getElementById("cornerIcon");
      const switchToOauthBtn = document.getElementById("switchToOauth");

vg>`;

      // 注入飞书 logo 到所有 pill shell
      document.querySelectorAll("[data-feishu-logo]").forEach((el) => {
        el.innerHTML = FEISHU_LOGO_SVG;
      });
      // 初始角标显示 QR icon（提示可切扫码）
      cornerIcon.innerHTML = QR_ICON_SVG;

      let currentMode = "oauth";
      function setMode(mode) {
        currentMode = mode;
        const isOauth = mode === "oauth";
        viewOauth.hidden = !isOauth;
        viewQr.hidden = isOauth;
        cornerIcon.innerHTML = isOauth ? QR_ICON_SVG : MONITOR_ICON_SVG;
        cornerBadge.setAttribute("aria-label", isOauth ? "切换到扫码登录" : "切换到账号登录");
        cornerBadge.setAttribute("title", isOauth ? "扫码登录" : "账号登录");
        if (mode === "qr") initQr(currentTenant);
        else cleanupQr();
      }
      cornerBadge.addEventListener("click", () => setMode(currentMode === "oauth" ? "qr" : "oauth"));
      switchToOauthBtn.addEventListener("click", () => setMode("oauth"));

      // ===== 2. OAuth 按钮点击（防双击） =====
      document.querySelectorAll("[data-login-tenant]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          btn.disabled = true;
          btn.querySelector(".btn-text").textContent = "跳转中…";
          const tenant = btn.dataset.loginTenant;
          window.location.href = `/auth/feishu/${tenant}/login`;
        });
      });

      // ===== 3. 扫码 SDK 加载 =====
      const FEISHU_QR_SDK_URL =
        "https://lf-package-cn.feishucdn.com/obj/feishu-static/lark/passport/qrcode/LarkSSOSDKWebQRCode-1.0.3.js";
      let sdkPromise = null;
      function loadFeishuQRSdk() {
        if (sdkPromise) return sdkPromise;
        if (window.QRLogin) {
          sdkPromise = Promise.resolve();
          return sdkPromise;
        }
        sdkPromise = new Promise((resolve, reject) => {
          const existing = document.querySelector(`script[src="${FEISHU_QR_SDK_URL}"]`);
          if (existing) {
            if (window.QRLogin) return resolve();
            existing.addEventListener("load", () => resolve(), { once: true });
            existing.addEventListener("error", () => {
              sdkPromise = null;
              reject(new Error("QR SDK load failed"));
            }, { once: true });
            return;
          }
          const s = document.createElement("script");
          s.src = FEISHU_QR_SDK_URL;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => {
            sdkPromise = null;
            reject(new Error("QR SDK load failed"));
          };
          document.head.appendChild(s);
        });
        return sdkPromise;
      }

      // ===== 4. 扫码视图状态 + 渲染 =====
      const qrMount = document.getElementById("qrMount");
      const qrLoading = document.getElementById("qrLoading");
      const qrError = document.getElementById("qrError");
      const qrErrorMsg = document.getElementById("qrErrorMsg");
      const qrRetry = document.getElementById("qrRetry");
      const qrExpired = document.getElementById("qrExpired");
      const qrHint = document.getElementById("qrHint");
      const qrTabs = document.querySelectorAll(".qr-tab");

      let currentTenant = "fbif";
      let currentGoto = "";
      let messageHandler = null;
      let expireTimer = null;
      let reloadKey = 0;

      function cleanupQr() {
        if (messageHandler) {
          window.removeEventListener("message", messageHandler);
          messageHandler = null;
        }
        if (expireTimer) {
          clearTimeout(expireTimer);
          expireTimer = null;
        }
        qrMount.innerHTML = "";
      }

      async function initQr(tenant) {
        setQrStatus("loading");
        cleanupQr();
        try {
          const headers = {};
          const stored = sessionStorage.getItem("shorturl_session_token");
          if (stored) headers["X-Session-Token"] = stored;
          const resp = await fetch(`/auth/feishu/${tenant}/qr-config`, {
            credentials: "include",
            headers,
          });
          if (!resp.ok) throw new Error(`qr-config ${resp.status}`);
          const cfg = await resp.json();
          if (!cfg.goto) throw new Error("缺少 goto");
          currentGoto = cfg.goto;

          await loadFeishuQRSdk();
          if (!window.QRLogin) throw new Error("飞书 SDK 未加载");

          const containerId = `feishu_qr_container_${tenant}_${++reloadKey}`;
          qrMount.innerHTML = `<div id="${containerId}" style="width:240px;height:240px;display:flex;align-items:center;justify-content:center"></div>`;

          const QRObj = window.QRLogin({
            id: containerId,
            goto: cfg.goto,
            width: "240",
            height: "240",
            style: "width:240px;height:240px",
          });

          messageHandler = (event) => {
            if (!QRObj.matchOrigin(event.origin)) return;
            if (!QRObj.matchData(event.data)) return;
            const tmpCode = event.data && event.data.tmp_code;
            if (!tmpCode) return;
            window.location.href = `${currentGoto}&tmp_code=${encodeURIComponent(tmpCode)}`;
          };
          window.addEventListener("message", messageHandler);

          const ttlMs = (cfg.expires_in || 300) * 1000 - 10000;
          if (ttlMs > 0) expireTimer = setTimeout(() => setQrStatus("expired"), ttlMs);

          setQrStatus("ready");
        } catch (err) {
          console.error("qr init failed:", err);
          setQrStatus("error", String(err.message || err));
        }
      }

      function setQrStatus(status, msg) {
        qrLoading.hidden = status !== "loading";
        qrError.hidden = status !== "error";
        qrExpired.hidden = status !== "expired";
        if (status === "error" && msg) qrErrorMsg.textContent = `加载失败：${msg}`;
      }

      qrRetry.addEventListener("click", () => initQr(currentTenant));
      qrExpired.addEventListener("click", () => initQr(currentTenant));

      qrTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const tenant = tab.dataset.qrTenant;
          if (tenant === currentTenant) return;
          currentTenant = tenant;
          qrTabs.forEach((t) => t.classList.toggle("active", t === tab));
          qrHint.textContent =
            tenant === "fbif" ? "请使用 FBIF 飞书移动端扫描" : "请使用 富的 飞书移动端扫描";
          initQr(tenant);
        });
      });

      // ===== 5. 错误 query 展示 =====
      (function showError() {
        const params = new URLSearchParams(window.location.search);
        const err = params.get("error");
        if (!err) return;
        const banner = document.getElementById("errorBanner");
        const map = {
          denied: "已取消授权，可重新登录。",
          state: "安全校验失败，请重新登录。",
          token: "飞书 token 交换失败，请重试。",
          no_code: "登录回调缺少授权码，请重试。",
          unauthorized_tenant: "你的飞书账号不在授权范围内，请确认你点击的是正确企业的登录按钮。",
          config: "服务未正确配置飞书登录，请联系管理员。",
        };
        banner.textContent = map[err] || "登录失败，请稍后重试。";
        banner.hidden = false;
      })();
    </script>
  </body>
