<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>登录 · 短链工具</title>

    <!-- 门禁型登录页：图片排在「JS → /api/me 401 → 渲染」瀑布之后才下载，preload 让图与 JS 并行 -->
    <link rel="preload" as="image" href="/mascots/door-login.webp" media="(min-width: 1024px)" />
    <link rel="preload" as="image" href="/mascots/fbif-logo.png" />

    <style>
      /* ===== FBIF 登录页 · Mascot 版（v6，手工翻译自 MascotLogin.tsx，视觉值逐一对齐）===== */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem; /* p-4 */
        background: #e4e9f0;
        color: #1f2329;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (min-width: 640px) {
        body {
          padding: 1.5rem; /* sm:p-6 */
        }
      }

      /* 居中卡片：窄屏单栏（仅表单）、≥lg 双栏（左插画 + 右表单） */
      .card {
        width: 100%;
        max-width: 372px;
        overflow: hidden;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 14px 44px rgba(20, 40, 80, 0.1);
        display: grid;
      }
      @media (min-width: 1024px) {
        .card {
          max-width: 820px;
          grid-template-columns: 2fr 3fr;
        }
      }

      /* 左：门 + 小黄人插画（窄屏隐藏） */
      .card__art {
        display: none;
        position: relative;
        background: #eef1f5;
      }
      @media (min-width: 1024px) {
        .card__art {
          display: block;
        }
      }
      /* 绝对定位铺满：grid 拉伸出的高度对 height:100% 不算「确定高度」，
         图会塌成 0 高露出底色。父级是 position:relative，用 inset:0 稳妥填充。 */
      .card__art img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
      }

      /* 右：飞书登录 */
      .card__form {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.75rem; /* py-16 px-7 */
      }
      @media (min-width: 640px) {
        .card__form {
          padding-left: 2.5rem; /* sm:px-10 */
          padding-right: 2.5rem;
        }
      }
      @media (min-width: 1024px) {
        .card__form {
          padding-top: 6rem; /* lg:py-24 */
          padding-bottom: 6rem;
        }
      }

      .form__inner {
        width: 100%;
        max-width: 300px;
      }

      .form__logo {
        margin-bottom: 0.75rem; /* mb-3（有副标题时）*/
        display: flex;
        justify-content: center;
      }
      .form__logo img {
        display: block;
        height: 46px;
        width: auto;
        user-select: none;
      }

      .form__subtitle {
        margin-bottom: 2rem; /* mb-8 */
        text-align: center;
        font-size: 13px;
        color: #8a8f99;
      }

      .login-btn {
        display: flex;
        height: 48px; /* h-12 */
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 0.625rem; /* gap-2.5 */
        border-radius: 9999px;
        border: 1.5px solid #e6e8ec;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #1f2329;
        cursor: pointer;
        transition: border-color 0.15s, background-color 0.15s;
      }
      .login-btn:hover:not(:disabled) {
        border-color: #cdd2d9;
        background: #fafbfc;
      }
      .login-btn:disabled {
        cursor: default;
        opacity: 0.65;
      }
      .login-btn svg {
        flex-shrink: 0;
      }

      .error-banner {
        margin-top: 1rem; /* mt-4 */
        border-radius: 8px;
        border: 1px solid #f0d4d2;
        background: #fdf2f1;
        padding: 0.5rem 0.75rem; /* py-2 px-3 */
        text-align: center;
        font-size: 13px;
        color: #b83430;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- 左：门 + 小黄人插画（窄屏隐藏） -->
      <div class="card__art">
        <img src="/mascots/door-login.webp" alt="" draggable="false" decoding="async" />
      </div>

      <!-- 右：飞书登录 -->
      <div class="card__form">
        <div class="form__inner">
          <div class="form__logo">
            <img src="/mascots/fbif-logo.png" alt="FBIF" draggable="false" />
          </div>
          <div class="form__subtitle">短链工具</div>

          <button type="button" class="login-btn" id="loginBtn">
            <svg width="20" height="20" fill="none" viewBox="0 0 48 48" aria-hidden="true">
              <path
                d="M10 8c0 1 7 3.5 14.745 16.744 0 0 4.184-4.363 6.255-5.744 1.5-1 2.712-1.332 2.712-1.332C33.712 15.156 29.5 8 28 8z"
                fill="#00d6b9"
              />
              <path
                d="M43.5 18.5c-1-.667-3.65-1.771-6.5-1.5a15 15 0 0 0-3.288.668S32.5 18 31 19c-2.07 1.38-6.255 5.744-6.255 5.744-1.428 1.397-3.05 2.732-5.245 3.756 0 0 7 3 11.5 3 5.063 0 7-3.5 7-3.5 1.5-3.305 3.5-7 5.5-9.5"
                fill="#163c9a"
              />
              <path
                d="M4 17.5v17c0 1 6 5.5 15 5.5 10 0 17.05-7.705 19-12 0 0-1.937 3.5-7 3.5-4.5 0-11.5-3-11.5-3-5.117-2.239-10.03-6.577-12.906-9.117C4.974 17.953 4 17.093 4 17.5"
                fill="#3370ff"
              />
            </svg>
            <span class="login-btn__text">使用飞书登录</span>
          </button>

          <div class="error-banner" id="errorBanner" hidden></div>
        </div>
      </div>
    </div>

    <script>
      // ===== -1. 飞书 webview 内自动免登（单应用：只走 fbif）=====
      // 飞书后台「网页应用首页 URL」配成 https://<部署域名>/login?tenant=fbif。
      // 员工在飞书工作台点应用图标 → 自动进来 → 这段跑免登（普通浏览器靠 UA 判断跳过）。
      // 富的员工经关联组织共享，也走同一个 fbif App，靠 user_info 返回的 tenant_key 区分身份。
      // 任何一步失败 → 自动回退到下方按钮登录，用户无感。
      (async function trySsoLogin() {
        const tenant = "fbif"; // 单应用只有 fbif
        let storedToken = "";
        try {
          storedToken = sessionStorage.getItem("shorturl_session_token") || "";
        } catch {}
        if (storedToken) return; // 让下面的 checkAlreadyLoggedIn 处理
        if (!/feishu|lark/i.test(navigator.userAgent || "")) return; // 普通浏览器不跑免登

        // 立即遮罩，避免用户看到按钮抢着点
        const mask = document.createElement("div");
        mask.style.cssText =
          "position:fixed;inset:0;background:#e4e9f0;display:grid;place-items:center;z-index:9999;" +
          "font-family:inherit;color:#8a8f99;font-size:14px";
        mask.textContent = "正在通过飞书登录…";
        document.body.appendChild(mask);
        let stopped = false;
        let readyTimer = null;
        const abort = (reason) => {
          if (stopped) return;
          stopped = true;
          if (readyTimer) clearTimeout(readyTimer);
          console.warn("[sso] fallback:", reason);
          mask.remove();
        };

        // 加载飞书 H5 SDK；普通浏览器不进入这段，避免外部打开时被遮罩卡住。
        try {
          await new Promise((resolve, reject) => {
            if (window.h5sdk) return resolve();
            const exist = document.querySelector('script[data-feishu-h5-sdk="1"]');
            if (exist) return exist.addEventListener("load", resolve, { once: true });
            const s = document.createElement("script");
            s.src = "https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.44.js";
            s.dataset.feishuH5Sdk = "1";
            s.onload = resolve;
            s.onerror = () => reject(new Error("sdk load failed"));
            document.head.appendChild(s);
          });
        } catch (e) {
          return abort("sdk_load_failed");
        }
        if (typeof window.h5sdk === "undefined") return abort("sdk_unavailable");

        // 拿 appID
        let appID;
        try {
          const r = await fetch(`/auth/feishu/${tenant}/sso-config`);
          if (!r.ok) return abort("config_failed");
          appID = (await r.json()).appID;
          if (!appID) return abort("config_missing_app_id");
        } catch (e) {
          return abort("config_failed");
        }

        function requestAccessCode() {
          return new Promise((resolve, reject) => {
            window.tt.requestAccess({
              appID,
              scopeList: [], // 空数组 = 仅授获取用户凭证；够拿 open_id + tenant_key + name
              success: (res) => {
                if (res && res.code) resolve({ code: res.code, method: "requestAccess" });
                else reject(new Error("no_code"));
              },
              fail: (err) => {
                const error = new Error("requestAccess_failed");
                error.errno = err && err.errno;
                reject(error);
              },
            });
          });
        }

        function requestAuthCode() {
          return new Promise((resolve, reject) => {
            window.tt.requestAuthCode({
              appId: appID,
              success: (res) => {
                if (res && res.code) resolve({ code: res.code, method: "requestAuthCode" });
                else reject(new Error("no_code"));
              },
              fail: () => reject(new Error("requestAuthCode_failed")),
            });
          });
        }

        async function requestFeishuCode() {
          if (window.tt && typeof window.tt.requestAccess === "function") {
            try {
              return await requestAccessCode();
            } catch (err) {
              if (String(err.errno) !== "103" || typeof window.tt.requestAuthCode !== "function") {
                throw err;
              }
            }
          }
          if (window.tt && typeof window.tt.requestAuthCode === "function") {
            return requestAuthCode();
          }
          throw new Error("no_supported_auth_api");
        }

        async function exchangeCode(result) {
          const r = await fetch(`/auth/feishu/${tenant}/sso-exchange`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(result),
          });
          if (!r.ok) throw new Error("exchange_failed");
          const { sessionToken } = await r.json();
          if (!sessionToken) throw new Error("no_session_token");
          return sessionToken;
        }

        // 5 秒 SDK ready 超时兜底
        readyTimer = setTimeout(() => abort("ready_timeout"), 5000);
        window.h5sdk.ready(() => {
          clearTimeout(readyTimer);
          if (stopped) return;
          (async () => {
            try {
              const sessionToken = await exchangeCode(await requestFeishuCode());
              try {
                sessionStorage.setItem("shorturl_session_token", sessionToken);
              } catch {}
              const next = new URLSearchParams(window.location.search).get("next") || "/";
              window.location.replace(next);
            } catch (e) {
              abort(e.message || "auth_failed");
            }
          })();
        });
      })();

      // ===== 0. 已登录直接跳走（避免登录后重复看到登录页）=====
      (async function checkAlreadyLoggedIn() {
        try {
          const headers = {};
          // 兼容 hash session_token 回流场景
          const hash = window.location.hash || "";
          const m = hash.match(/(?:^|[&#])session_token=([^&]+)/);
          if (m) {
            try {
              sessionStorage.setItem("shorturl_session_token", decodeURIComponent(m[1]));
              window.history.replaceState({}, "", window.location.pathname + window.location.search);
            } catch {}
          }
          const stored = sessionStorage.getItem("shorturl_session_token");
          if (stored) headers["X-Session-Token"] = stored;
          const res = await fetch("/api/me?optional=1", { credentials: "include", headers });
          if (res.ok) {
            const data = await res.json();
            if (data.ok) {
              const next = new URLSearchParams(window.location.search).get("next") || "/";
              window.location.replace(next);
            }
          }
        } catch {
          // 网络错误就让用户手动点登录
        }
      })();

      // ===== 1. 登录按钮（防双击）=====
      (function wireLoginButton() {
        const btn = document.getElementById("loginBtn");
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          btn.disabled = true;
          btn.querySelector(".login-btn__text").textContent = "跳转中…";
          window.location.href = "/auth/feishu/fbif/login";
        });
      })();

      // ===== 2. 错误 query 展示（错误码来自后端 finishLogin / handleCallback）=====
      (function showError() {
        const err = new URLSearchParams(window.location.search).get("error");
        if (!err) return;
        const banner = document.getElementById("errorBanner");
        const map = {
          denied: "已取消飞书授权，请重新登录。",
          state: "安全校验失败，请重新登录。",
          token: "飞书登录失败，请重新尝试。",
          no_code: "登录回调缺少授权码，请重试。",
          unauthorized_tenant: "当前飞书账号无权访问，请联系管理员。",
          config: "服务未正确配置飞书登录，请联系管理员。",
        };
        banner.textContent = map[err] || "登录失败，请稍后重试。";
        banner.hidden = false;
      })();
    </script>
  </body>
</html>
